[package]
name = "sdl2xinput"
version = "0.3.1"
edition = "2024"

[dependencies]
sdl3-sys = { version = "0.7.1", features = ["build-from-source-static", "debug-impls"] }
sdl3 = { version = "0.20.0", features = ["hidapi"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.104"
serde_json = "1.0.151"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tray-item = "0.10.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
