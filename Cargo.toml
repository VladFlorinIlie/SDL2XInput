[package]
name = "sdl2xinput"
version = "0.3.0"
edition = "2024"

[dependencies]
sdl3-sys = { version = "0.6.6", features = ["build-from-source-static", "debug-impls"] }
sdl3 = { version = "0.18.4", features = ["hidapi"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.102"
serde_json = "1.0.150"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
tray-item = "0.10.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
